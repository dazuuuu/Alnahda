<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Al NAHDA Agency</title>
  <link rel="stylesheet" href="styles.css">
  <style>
/* General form-row layout */
.form-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.form-row label {
  flex: 1 1 60%;
  font-weight: 500;
  color: #1f2937;
  font-size: 15px;
}

/* Radio group container */
.radio-group {
  display: flex;
  justify-content: flex-end;
  gap: 20px;
  flex: 1 1 40%;
}

/* Align radio label and input inline */
.radio-group label {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  font-size: 15px;
  color: #374151;
  transition: color 0.3s ease;
}

/* Hide default radio appearance and style custom circle */
.radio-group input[type="radio"] {
  appearance: none;
  width: 18px;
  height: 18px;
  border: 2px solid #0d8bf2;
  border-radius: 50%;
  outline: none;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  background-color: white;
}

/* Add a nice blue inner dot when selected */
.radio-group input[type="radio"]:checked::before {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 8px;
  height: 8px;
  background: #0d8bf2;
  border-radius: 50%;
  transition: transform 0.2s ease;
}

/* Hover and focus states */
.radio-group input[type="radio"]:hover {
  box-shadow: 0 0 0 4px rgba(13, 139, 242, 0.1);
}

.radio-group label:hover {
  color: #0d8bf2;
}

/* Responsive tweak for small screens */
@media (max-width: 600px) {
  .form-row {
    flex-direction: column;
    align-items: flex-start;
  }
  .radio-group {
    justify-content: flex-start;
  }
}
</style>

</head>
<body>
  <header class="site-header">
    <div class="container nav-container">
      <a class="brand" href="index.html" aria-label="Al NAHDA Agency home">
        <img src="assets/logo-no-bg.png" alt="Al NAHDA Agency logo" class="brand-logo">
        <div>
          <div class="brand-name">AL NAHDA AGENCY</div>
          <div class="brand-tagline">Recruitment Excellence</div>
        </div>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="sr-only">Toggle navigation</span>
      </button>
      <nav id="primary-nav" class="site-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
      </nav>
    </div>
  </header>

  <section class="section" id="register">
    <div class="container">
      <div class="application-header">
        <h2>Apply for Middle East Opportunities</h2>
        <p>Submit your information and our recruiters will connect you with roles that match your skills, experience, and career ambitions.</p>
      </div>

      <div class="application-layout">
        <form id="registration-form" class="application-form" novalidate enctype="multipart/form-data">

          <!-- PERSONAL DETAILS -->
          <h3>Personal Details</h3>

          <div class="form-row">
            <label for="fullname">Full Name *</label>
            <input type="text" id="fullname" name="fullname" required>
          </div>

          <div class="form-row">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="form-row">
            <label for="weight">Average weight (kgs) *</label>
            <input type="number" id="weight" name="weight" required>
          </div>

          <div class="form-row">
            <label for="phone">Phone 1 *</label>
            <input type="tel" id="phone" name="phone" required pattern="[0-9+()\-\s]{7,}">
          </div>

          <div class="form-row">
            <label for="phone2">Phone 2 (optional)</label>
            <input type="tel" id="phone2" name="phone2" pattern="[0-9+()\-\s]{7,}">
          </div>

          <div class="form-row">
            <label for="county">County *</label>
            <select id="county" name="county" required>
              <option value="">Select your county</option>
              <option>Baringo</option><option>Bomet</option><option>Bungoma</option><option>Busia</option>
              <option>Elgeyo-Marakwet</option><option>Embu</option><option>Garissa</option><option>Homa Bay</option>
              <option>Isiolo</option><option>Kajiado</option><option>Kakamega</option><option>Kericho</option>
              <option>Kiambu</option><option>Kilifi</option><option>Kirinyaga</option><option>Kisii</option>
              <option>Kisumu</option><option>Kitui</option><option>Kwale</option><option>Laikipia</option>
              <option>Lamu</option><option>Machakos</option><option>Makueni</option><option>Mandera</option>
              <option>Marsabit</option><option>Meru</option><option>Migori</option><option>Mombasa</option>
              <option>Murang'a</option><option>Nairobi City</option><option>Nakuru</option><option>Nandi</option>
              <option>Narok</option><option>Nyamira</option><option>Nyandarua</option><option>Nyeri</option>
              <option>Samburu</option><option>Siaya</option><option>Taita-Taveta</option><option>Tana River</option>
              <option>Tharaka-Nithi</option><option>Trans Nzoia</option><option>Turkana</option><option>Uasin Gishu</option>
              <option>Vihiga</option><option>Wajir</option><option>West Pokot</option>
            </select>
          </div>

          <div class="form-row">
            <label for="age">Age *</label>
            <input type="number" id="age" name="age" min="18" max="65" required>
          </div>

          <div class="form-row">
            <label for="preferred-role">Preferred Job Category *</label>
            <select id="preferred-role" name="preferredRole" required>
              <option value="">Select a category</option>
              <option>HOUSEMAID</option>
            </select>
          </div>

          <div class="form-row">
            <label for="gender">Gender *</label>
            <input type="text" id="gender" name="gender" required>
          </div>

          <div class="form-row">
            <label for="languages">Languages Spoken *</label>
            <input type="text" id="languages" name="languages" required placeholder="English, Arabic, Swahili...">
          </div>

          <hr>

          <!-- WORK EXPERIENCE SECTION -->
          <h3>Work Information</h3>

          <div class="form-row">
            <label>Have you worked in SAUDIA ARABIA as a housemaid before? *</label>
            <div class="radio-group">
              <label><input type="radio" name="travelledSaudia" value="yes" required> Yes</label>
              <label><input type="radio" name="travelledSaudia" value="no"> No</label>
            </div>
          </div>

          <div class="form-row saudia-only">
            <label for="returnYear">When did you last come back from SAUDIA ARABIA as a housemaid? *</label>
            <select id="returnYear" name="returnYear">
              <option value="">Select year</option>
            </select>
          </div>

          <div class="form-row saudia-only">
            <label>How many years did you work in SAUDIA ARABIA? *</label>
            <input type="number" name="durationYears" id="durationYears" min="1" placeholder="Enter number">
          </div>

          <div class="form-row saudia-only">
            <label>Have you finished your contract? *</label>
            <div class="radio-group">
              <label><input type="radio" name="finishedContract" value="yes"> Yes</label>
              <label><input type="radio" name="finishedContract" value="no"> No</label>
            </div>
          </div>

          <div class="form-row saudia-only">
            <label>Did you have any issues with your sponsor? *</label>
            <div class="radio-group">
              <label><input type="radio" name="issueWithSponsor" value="yes"> Yes</label>
              <label><input type="radio" name="issueWithSponsor" value="no"> No</label>
            </div>
            <textarea id="contractExplain" class="hidden" name="contractExplain" rows="3" placeholder="Can you explain the nature of your issue?"></textarea>
          </div>

          <div class="form-row saudia-only">
            <label>Were you deported? *</label>
            <div class="radio-group">
              <label><input type="radio" name="deported" value="yes"> Yes</label>
              <label><input type="radio" name="deported" value="no"> No</label>
            </div>
          </div>

          <div class="form-row saudia-only">
            <label>Were you given final exit? *</label>
            <div class="radio-group">
              <label><input type="radio" name="exitVisa" value="yes"> Yes</label>
              <label><input type="radio" name="exitVisa" value="no"> No</label>
            </div>
          </div>

          <div class="form-row saudia-only">
            <label>Were you given re-entry visa? *</label>
            <div class="radio-group">
              <label><input type="radio" name="reentryVisa" value="yes"> Yes</label>
              <label><input type="radio" name="reentryVisa" value="no"> No</label>
            </div>
          </div>

          <div class="form-row">
            <label>Have you ever traveled to Lebanon as a housemaid? *</label>
            <div class="radio-group">
              <label><input type="radio" name="lebanon" value="yes" required> Yes</label>
              <label><input type="radio" name="lebanon" value="no"> No</label>
            </div>
          </div>

          <div class="form-row">
            <label>Have you ever traveled to Jordan as a housemaid? *</label>
            <div class="radio-group">
              <label><input type="radio" name="jordan" value="yes" required> Yes</label>
              <label><input type="radio" name="jordan" value="no"> No</label>
            </div>
          </div>

          <div class="form-row">
            <label>Are you medically fit? *</label>
            <div class="radio-group">
              <label><input type="radio" name="medicalFit" value="yes" required> Yes</label>
              <label><input type="radio" name="medicalFit" value="no"> No</label>
            </div>
          </div>

          <div class="form-row" id="willingRow">
            <label id="willingLabel">Are you willing to go to SAUDIA? *</label>
            <div class="radio-group">
              <label><input type="radio" name="willingToReturn" value="yes" required> Yes</label>
              <label><input type="radio" name="willingToReturn" value="no"> No</label>
            </div>
          </div>
          
          <div class="form-row">
  <label>Do you have a valid passport? *</label>
  <div class="radio-group">
    <label><input type="radio" name="validPassport" value="yes" required> Yes</label>
    <label><input type="radio" name="validPassport" value="no"> No</label>
  </div>
</div>

<div class="form-row">
  <label>Do you have a valid Certificate of Good Conduct? *</label>
  <div class="radio-group">
    <label><input type="radio" name="validConduct" value="yes" required> Yes</label>
    <label><input type="radio" name="validConduct" value="no"> No</label>
  </div>
</div>

<div class="form-row">
  <label for="appointmentPreference">When can you come to our offices for appointment? *</label>
  <input type="date" id="appointmentPreference" name="appointmentPreference" required>
</div>



          <div class="form-row checkbox-row">
            <input type="checkbox" id="consent" name="consent" required>
            <label for="consent">I agree to be contacted by Al NAHDA Agency about overseas job openings.</label>
          </div>

          <div class="application-actions">
            <button type="submit" class="btn btn-full application-submit">Submit Application</button>
          </div>

          <p class="form-feedback" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </section>

  <footer class="site-footer">
   
  </footer>

  <script src="script.js"></script>
</body>
</html>
